<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101310"><meta name="description" content="浣熊市外围的离线文字生存游戏。"><link rel="icon" href="assets/game-icon.ico" sizes="any"><title>生化危机 · 生存人生</title><link rel="stylesheet" href="styles.css"></head>
<body>
<a class="skip" href="#main">跳到游戏内容</a>
<header class="topbar"><a class="brand" href="#home" aria-label="回到标题"><span class="brand-mark">R</span><span>生存人生 <small>RACCOON OUTSKIRTS · 1998</small></span></a><div id="save-status" class="save-status" role="status" aria-live="polite">离线单人游戏 · 无账户</div><button id="home-button" class="quiet" hidden>返回标题</button></header>
<main id="main" tabindex="-1">
<section id="home" class="screen home-screen"><div class="home-copy"><p class="eyebrow">生化危机世界 · 原创幸存者章节</p><h1>活过今晚。<br><em>记住你救过谁。</em></h1><p class="lead">浣熊市外围 · 撤离前夕<br>十个行动时段，一条正在关闭的生路。</p><div class="home-actions"><button class="primary" id="start-button">开始人生 <span>→</span></button><button class="secondary" id="continue-button">继续游戏</button><button class="text-button" id="manual-button">存档管理</button><button class="text-button" id="help-button">玩法说明</button></div><p class="fine">纯本地存储 · 不联网 · 可导出 JSON 备份</p></div><div class="home-art" aria-label="雨夜的撤离路口"><div class="moon"></div><div class="city-line city-back"></div><div class="city-line city-front"></div><div class="road"></div><div class="signal"><span>EVACUATION</span><b>03:00</b></div><div class="home-caption">OUTER PERIMETER / DAY 01</div></div></section>
<section id="setup" class="screen setup-screen" hidden><div class="section-head"><p class="eyebrow" id="setup-eyebrow">建立幸存者档案 · 01 / 03</p><h2 id="setup-title">你从哪里开始？</h2><p>出身影响初始技能和物资。角色记录只改变文本，不会生成额外能力。</p></div><form id="character-form" class="character-form"><div class="wizard-meter"><i class="current"></i><i></i><i></i></div><label data-wizard="1">姓名<input name="name" required maxlength="20" value="幸存者" autocomplete="off"><small>1—20 个字符</small></label><label data-wizard="1">年龄<input name="age" type="number" min="18" max="65" value="25" required></label><label data-wizard="1">性别 / 称呼<input name="gender" maxlength="12" placeholder="可留空"></label><label data-wizard="1">出身<select name="origin"><option value="citizen">普通市民</option><option value="medic">医护人员</option><option value="mechanic">维修工</option></select></label><button data-wizard="1" type="button" class="text-button randomize" id="randomize-button">随机生成一个幸存者 ↻</button><label data-wizard="2">天赋<select name="trait"><option value="steady">沉着：无额外修正</option><option value="hunter">天生猎手：战斗阈值 +10</option><option value="healer">快速愈合：日终 HP +5</option><option value="iron">钢铁意志：SAN 损失减半</option></select></label><label data-wizard="2">缺陷<select name="flaw"><option value="none">无明显缺陷</option><option value="old_injury">旧伤：体力上限 80</option><option value="susceptible">病毒易感：感染增量翻倍</option><option value="social">社交障碍：交涉阈值 -10</option></select></label><label data-wizard="2">难度<select name="difficulty"><option value="standard">标准</option><option value="easy">休闲</option></select></label><label data-wizard="2">随机事件<select name="randomEvents"><option value="true">开启</option><option value="false">关闭</option></select></label><label data-wizard="2">性格关键词<input name="personality" maxlength="30" placeholder="最多三个词，例如：谨慎、守信、固执"><small>角色记录，不提供属性奖励</small></label><label data-wizard="2">人生目标<input name="goal" maxlength="60" placeholder="例如：把妹妹带出封锁区"><small>最多 60 个字符</small></label><label data-wizard="2" class="check-label"><input name="showInf" type="checkbox" checked> 显示感染数值</label><label data-wizard="2" class="check-label"><input name="endingHints" type="checkbox" checked> 关键选择前显示结局提示</label><label data-wizard="2" class="check-label"><input name="permadeath" type="checkbox"> 永久死亡（无法从本局旧档重试）</label><div data-wizard="3" class="review-card"></div><div class="form-actions"><button type="button" class="secondary" id="wizard-back">返回</button><button type="button" class="secondary" id="wizard-next">下一步 <span>→</span></button><button class="primary" id="wizard-submit" type="submit" hidden>确认档案并开始 <span>→</span></button></div></form></section>
<section id="game" class="screen game-screen" hidden><div id="hud" class="hud"></div><nav id="mobile-tabs" class="mobile-tabs" aria-label="游戏面板"><button class="active" data-tab="story">剧情</button><button data-tab="map">地图</button><button data-tab="bag">背包</button><button data-tab="tasks">任务</button><button data-tab="people">同伴</button></nav><div class="game-grid"><aside id="left-panel" class="side-panel"><div id="character-panel"></div><div id="task-panel"></div><div id="people-panel"></div></aside><section id="story-panel" class="story-panel"><div id="story-content"></div><div id="action-list" class="action-list"></div></section><aside id="right-panel" class="side-panel"><div id="map-panel"></div><div id="inventory-panel"></div></aside></div></section>
<section id="ending" class="screen ending-screen" hidden><p class="eyebrow">RUN COMPLETE · EPILOGUE</p><h2 id="ending-title"></h2><p id="ending-copy"></p><div id="ending-details"></div><button class="primary" id="ending-home">返回标题</button><button class="secondary" id="restart-button">开始新人生</button></section>
</main>
<dialog id="modal" aria-labelledby="modal-title"><form method="dialog" class="modal-card"><button class="modal-close" aria-label="关闭">×</button><p class="eyebrow">SURVIVAL NOTES</p><h2 id="modal-title"></h2><div id="modal-content"></div><div id="modal-actions" class="modal-actions"></div></form></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script defer src="js/content.js"></script><script defer src="js/rules.js"></script><script defer src="js/storage.js"></script><script defer src="js/ui.js"></script><script defer src="js/app.js"></script>
</body></html>
